schema_version = "1.4"
# the answer is copied from the agent's container into the separate verifier at the same path
artifacts = ["/app/answer.json"]

[task]
name = "palanor/oe-2025-10-15-fred_unemployment-30d-range"
version = "0.1.0"
description = "Will the U.S. unemployment rate (BLS, seasonally adjusted) for November 2025 (the latest monthly reading dated on or before 2025-11-14) be at least 4.2% and below 4.5%?"
keywords = ["forecasting", "outcome-evals", "fred_unemployment", "binary"]

[[task.authors]]
name = "Palanor"
email = "opensource@palanor.com"

[metadata]
eval = "Outcome Evals"
split = "resolved_history"
series_id = "fred_unemployment"
kind = "binary"
made_on = "2025-10-15"
deadline = "2025-11-14"
source = "Source: U.S. Bureau of Labor Statistics"
license = "U.S. Government work (public domain)"
caveat = "Resolved history: not a test of forecasting for any model trained after the outcome."

[verifier]
timeout_sec = 120.0
# the grader runs in its own container: the agent never sees tests/ or the resolution
environment_mode = "separate"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
