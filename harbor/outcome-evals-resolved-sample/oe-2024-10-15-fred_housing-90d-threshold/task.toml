schema_version = "1.4"
# the answer is copied from the agent's container into the separate verifier at the same path
artifacts = ["/app/answer.json"]

[task]
name = "palanor/oe-2024-10-15-fred_housing-90d-threshold"
version = "0.1.0"
description = "Will U.S. housing starts (Census, seasonally adjusted annual rate, thousands of units) for January 2025 (the latest monthly reading dated on or before 2025-01-13) be below 1,300 thousand?"
keywords = ["forecasting", "outcome-evals", "fred_housing", "binary"]

[[task.authors]]
name = "Palanor"
email = "opensource@palanor.com"

[metadata]
eval = "Outcome Evals"
split = "resolved_history"
series_id = "fred_housing"
kind = "binary"
made_on = "2024-10-15"
deadline = "2025-01-13"
source = "Source: U.S. Census Bureau."
license = "U.S. Government work (17 U.S.C. §105)"
caveat = "Resolved history: not a test of forecasting for any model trained after the outcome."

[verifier]
timeout_sec = 120.0
# the grader runs in its own container: the agent never sees tests/ or the resolution
environment_mode = "separate"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
