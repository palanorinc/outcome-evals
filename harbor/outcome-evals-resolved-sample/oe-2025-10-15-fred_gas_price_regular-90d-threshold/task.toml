schema_version = "1.4"
# the answer is copied from the agent's container into the separate verifier at the same path
artifacts = ["/app/answer.json"]

[task]
name = "palanor/oe-2025-10-15-fred_gas_price_regular-90d-threshold"
version = "0.1.0"
description = "Will the U.S. average retail price of regular gasoline (EIA weekly survey, dollars a gallon) for the latest weekly reading dated on or before 2026-01-13 (expected: 2026-01-12) be above $3.300?"
keywords = ["forecasting", "outcome-evals", "fred_gas_price_regular", "binary"]

[[task.authors]]
name = "Palanor"
email = "opensource@palanor.com"

[metadata]
eval = "Outcome Evals"
split = "resolved_history"
series_id = "fred_gas_price_regular"
kind = "binary"
made_on = "2025-10-15"
deadline = "2026-01-13"
source = "Source: U.S. Energy Information Administration"
license = "EIA Copyrights & Reuse (public domain)"
caveat = "Resolved history: not a test of forecasting for any model trained after the outcome."

[verifier]
timeout_sec = 120.0
# the grader runs in its own container: the agent never sees tests/ or the resolution
environment_mode = "separate"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
