schema_version = "1.4"
# the answer is copied from the agent's container into the separate verifier at the same path
artifacts = ["/app/answer.json"]

[task]
name = "palanor/oe-2024-01-15-construction-30d-range"
version = "0.1.0"
description = "Will the one-month change in U.S. total construction spending (Census, seasonally adjusted annual rate; computed from the level) for February 2024 (the latest monthly reading dated on or before 2024-02-14) be at least 0.70% and below 2.10%?"
keywords = ["forecasting", "outcome-evals", "construction", "binary"]

[[task.authors]]
name = "Palanor"
email = "opensource@palanor.com"

[metadata]
eval = "Outcome Evals"
split = "resolved_history"
series_id = "construction"
kind = "binary"
made_on = "2024-01-15"
deadline = "2024-02-14"
source = "Source: U.S. Census Bureau."
license = "U.S. Government work (17 U.S.C. §105)"
caveat = "Resolved history: not a test of forecasting for any model trained after the outcome."

[verifier]
timeout_sec = 120.0
# the grader runs in its own container: the agent never sees tests/ or the resolution
environment_mode = "separate"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
