schema_version = "1.4"
# the answer is copied from the agent's container into the separate verifier at the same path
artifacts = ["/app/answer.json"]

[task]
name = "palanor/oe-2026-04-15-fred_core_cpi-30d-number"
version = "0.1.0"
description = "What will the 12-month change in U.S. core CPI (CPI-U less food and energy, seasonally adjusted; computed from the index) be for May 2026 (the latest monthly reading dated on or before 2026-05-15)?"
keywords = ["forecasting", "outcome-evals", "fred_core_cpi", "number"]

[[task.authors]]
name = "Palanor"
email = "opensource@palanor.com"

[metadata]
eval = "Outcome Evals"
split = "resolved_history"
series_id = "fred_core_cpi"
kind = "number"
made_on = "2026-04-15"
deadline = "2026-05-15"
source = "Source: U.S. Bureau of Labor Statistics"
license = "U.S. Government work (public domain)"
caveat = "Resolved history: not a test of forecasting for any model trained after the outcome."

[verifier]
timeout_sec = 120.0
# the grader runs in its own container: the agent never sees tests/ or the resolution
environment_mode = "separate"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
