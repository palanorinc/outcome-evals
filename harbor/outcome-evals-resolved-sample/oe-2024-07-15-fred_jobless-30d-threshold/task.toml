schema_version = "1.4"
# the answer is copied from the agent's container into the separate verifier at the same path
artifacts = ["/app/answer.json"]

[task]
name = "palanor/oe-2024-07-15-fred_jobless-30d-threshold"
version = "0.1.0"
description = "Will U.S. initial unemployment insurance claims (DOL, seasonally adjusted, week ending) for the latest weekly reading dated on or before 2024-08-14 (expected: 2024-08-10) be below 205,000?"
keywords = ["forecasting", "outcome-evals", "fred_jobless", "binary"]

[[task.authors]]
name = "Palanor"
email = "opensource@palanor.com"

[metadata]
eval = "Outcome Evals"
split = "resolved_history"
series_id = "fred_jobless"
kind = "binary"
made_on = "2024-07-15"
deadline = "2024-08-14"
source = "Source: U.S. Department of Labor."
license = "Public domain (U.S. Government work)"
caveat = "Resolved history: not a test of forecasting for any model trained after the outcome."

[verifier]
timeout_sec = 120.0
# the grader runs in its own container: the agent never sees tests/ or the resolution
environment_mode = "separate"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
