schema_version = "1.4"
# the answer is copied from the agent's container into the separate verifier at the same path
artifacts = ["/app/answer.json"]

[task]
name = "palanor/oe-2026-07-15-rates.spread_2y10y-90d-direction"
version = "0.1.0"
description = "Will the 10-year minus 2-year U.S. Treasury par yield spread (Treasury daily par yield curve, percentage points) for 2026-10-13 (or the last business day before it with a published reading) be above 0.40 pp, its value for 2026-07-14?"
keywords = ["forecasting", "outcome-evals", "rates.spread_2y10y", "binary"]

[[task.authors]]
name = "Palanor"
email = "opensource@palanor.com"

[metadata]
eval = "Outcome Evals"
split = "resolved_history"
series_id = "rates.spread_2y10y"
kind = "binary"
made_on = "2026-07-15"
deadline = "2026-10-13"
source = "Source: U.S. Treasury, Bureau of the Fiscal Service"
license = "Fiscal Data API license (public domain)"
caveat = "Resolved history: not a test of forecasting for any model trained after the outcome."

[verifier]
timeout_sec = 120.0
# the grader runs in its own container: the agent never sees tests/ or the resolution
environment_mode = "separate"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
