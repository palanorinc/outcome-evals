name: release

# Publishes to PyPI when a tag like v0.1.0 is pushed, through PyPI trusted
# publishing: no token is stored anywhere. It needs a one-time "pending
# publisher" on pypi.org (project outcome-evals, owner palanorinc, repository
# outcome-evals, workflow release.yml, environment pypi).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
